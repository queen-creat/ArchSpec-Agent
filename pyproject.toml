[project]
name = "archspec-agent"
version = "0.1.0"
description = "面向建筑设计人员的规范检索与设计合规辅助平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0,<0.9.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "lxml>=6.1.3,<7",
    "pymupdf>=1.26.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "rapidocr>=3.9.2,<4.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
    "boto3>=1.40,<2.0",
    "psycopg[binary]>=3.3,<4",
    "certifi>=2024.8.30",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archspec"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
